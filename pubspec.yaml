name: afiete
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ✅ Core
  cupertino_icons: ^1.0.8
  equatable: ^2.0.5
  intl: ^0.20.2
  dartz: ^0.10.1
  dio: ^5.9.2
  get_it: ^7.6.7
  shared_preferences: ^2.3.2

  # ✅ State Management
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6

  # ✅ Firebase
  firebase_core: ^3.1.1
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.0.1
  google_sign_in: ^6.2.1

  # ✅ UI
  flutter_svg: ^2.2.3
  pinput: ^6.0.2
  smooth_page_indicator: ^1.1.0

  # ✅ HTML & PDF
  flutter_html: ^3.0.0-beta.2

  # ✅ File & Share
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  open_file: ^3.3.2 # ✅ تحديد version
  permission_handler: ^11.3.1 # ✅ تحديد version
  image_gallery_saver_plus: ^4.0.1

  # ✅ Media
  just_audio: ^0.10.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: null

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: sans
      fonts:
        - asset: assets/fonts/Microsoft Sans Serif.ttf
    - family: cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont_slnt,wght.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
