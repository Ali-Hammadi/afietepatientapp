name: afiete
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  bloc: ^8.1.4
  cloud_firestore: ^5.0.1
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.9.2
  equatable: ^2.0.5
  firebase_auth: ^5.7.0
  firebase_core: ^3.1.1
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.3
  get_it: ^7.6.7
  google_sign_in: ^6.2.1
  image_gallery_saver_plus: ^4.0.1
  intl: ^0.20.2
  just_audio: ^0.10.4
  path_provider: ^2.1.5
  pinput: ^6.0.2
  share_plus: ^10.1.4
  shared_preferences: ^2.3.2
  smooth_page_indicator: ^1.1.0

dev_dependencies:
  flutter_launcher_icons: null
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: sans
      fonts:
        - asset: assets/fonts/Microsoft Sans Serif.ttf
    - family: cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont_slnt,wght.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
