components:
  schemas:
    ActionTakenEnum:
      enum:
      - NONE
      - FUNDS_FROZEN
      - ACCOUNT_SUSPENDED
      - ACCOUNT_DELETED
      - DISMISSED
      type: string
      description: |-
        * `NONE` - No Action Taken
        * `FUNDS_FROZEN` - Financial Funds Frozen
        * `ACCOUNT_SUSPENDED` - Account Temporarily Suspended
        * `ACCOUNT_DELETED` - Account Permanently Deleted
        * `DISMISSED` - Report Dismissed / Ignored
    ActivateUser:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    AnswerOption:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        text:
          type: string
          maxLength: 255
        score:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        question:
          type: integer
      required:
      - id
      - question
      - score
      - text
    AppReport:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        report_type:
          $ref: '#/components/schemas/ReportTypeEnum'
        report_type_display:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 200
        content:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_resolved:
          type: boolean
          readOnly: true
      required:
      - content
      - created_at
      - id
      - is_resolved
      - report_type_display
      - title
    Appointment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        doctor_username:
          type: string
          writeOnly: true
        type:
          $ref: '#/components/schemas/TypeEnum'
        day_date:
          type: string
          format: date
          writeOnly: true
        slot:
          allOf:
          - $ref: '#/components/schemas/Slot'
          writeOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusC3dEnum'
          readOnly: true
        date:
          type: string
          format: date-time
          readOnly: true
        has_next_session:
          type: boolean
          readOnly: true
      required:
      - date
      - day_date
      - doctor_username
      - has_next_session
      - id
      - slot
      - status
    AppointmentList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        patient_username:
          type: string
          readOnly: true
        doctor_username:
          type: string
          readOnly: true
        date:
          type: string
          format: date-time
        type:
          $ref: '#/components/schemas/TypeEnum'
        status:
          $ref: '#/components/schemas/StatusC3dEnum'
        has_next_session:
          type: boolean
      required:
      - date
      - doctor_username
      - id
      - patient_username
    ArticaleCraete:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        content:
          type: string
        specialization:
          type: integer
          nullable: true
      required:
      - content
      - title
    Article:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        content:
          type: string
        status:
          $ref: '#/components/schemas/ArticleStatusEnum'
        author:
          allOf:
          - $ref: '#/components/schemas/Author'
          readOnly: true
        specialization:
          allOf:
          - $ref: '#/components/schemas/Specialization'
          readOnly: true
        likes:
          type: integer
          readOnly: true
          default: 0
        dislikes:
          type: integer
          readOnly: true
          default: 0
        score:
          type: integer
          readOnly: true
          default: 0
        reaction:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - content
      - created_at
      - dislikes
      - id
      - likes
      - reaction
      - score
      - specialization
      - title
      - updated_at
    ArticleDeleteResponse:
      type: object
      properties:
        message:
          type: string
          description: Article deletion confirmation message.
      required:
      - message
    ArticleStatusEnum:
      enum:
      - Pending
      - Approved
      - Rejected
      type: string
      description: |-
        * `Pending` - Pending
        * `Approved` - Approved
        * `Rejected` - Rejected
    ArticleUpdate:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        content:
          type: string
        specialization:
          type: integer
          nullable: true
      required:
      - content
      - title
    Author:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AuthorDoctor'
        job_title:
          $ref: '#/components/schemas/job_titleSerialzer'
        photo:
          type: string
          format: uri
          nullable: true
      required:
      - job_title
      - user
    AuthorDoctor:
      type: object
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - username
    AvailableSlots:
      type: object
      properties:
        date:
          type: string
          format: date
        available_slots:
          type: string
          readOnly: true
      required:
      - available_slots
      - date
    BlankEnum:
      enum:
      - ''
    DayOfWeekEnum:
      enum:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      type: string
      description: |-
        * `Monday` - Monday
        * `Tuesday` - Tuesday
        * `Wednesday` - Wednesday
        * `Thursday` - Thursday
        * `Friday` - Friday
        * `Saturday` - Saturday
        * `Sunday` - Sunday
    DoctorEducation:
      type: object
      properties:
        degree:
          type: string
          maxLength: 100
        institution:
          type: string
          maxLength: 100
        graduation_year:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        license_number:
          type: string
          nullable: true
          maxLength: 100
        certificate:
          type: string
          format: uri
          nullable: true
      required:
